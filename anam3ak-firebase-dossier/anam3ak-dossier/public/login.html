<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Login OTP</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"/></head><body class="text-slate-900 bg-slate-50"><div class="max-w-xl mx-auto p-5 md:p-8"><a class="inline-flex items-center gap-3" href="./index.html"><img src="./assets/logo.svg" class="h-10 w-auto" alt="AnaM3ak"/></a><div class="mt-6 bg-white rounded-[2.2rem] border border-slate-100 shadow-xl p-7 md:p-10"><h1 class="text-3xl font-black">دخول عبر OTP</h1><p class="mt-2 text-sm font-bold text-slate-500">فعّل Phone Sign-in فـ Firebase Console.</p><div class="mt-6 space-y-4"><input id="phone" placeholder="06xxxxxxxx" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"><div id="recaptcha" class="rounded-2xl overflow-hidden"></div><button id="sendBtn" class="w-full btn-primary text-white py-4 rounded-2xl font-black">صيفط OTP</button><div class="grid grid-cols-3 gap-3"><input id="code" placeholder="123456" class="col-span-2 w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"><button id="verifyBtn" class="btn-soft py-4 rounded-2xl font-black">تأكيد</button></div><div id="msg" class="text-sm font-black text-slate-700"></div><div class="pt-2 text-sm font-bold text-slate-600">من بعد الدخول: <a class="text-blue-600 underline" href="./pro-dashboard.html">Dashboard</a></div></div></div></div><script type="module">import { auth, firebase } from "./firebase.js";import { isValidMoroccoPhone, toast } from "./utils.js";const phoneEl=document.getElementById("phone");const sendBtn=document.getElementById("sendBtn");const verifyBtn=document.getElementById("verifyBtn");const codeEl=document.getElementById("code");const msg=document.getElementById("msg");let confirmation=null;const verifier=new firebase.RecaptchaVerifier(auth,"recaptcha",{size:"normal"});sendBtn.onclick=async()=>{try{const phone=phoneEl.value.trim();if(!isValidMoroccoPhone(phone)) return toast(msg,"⚠️ رقم الهاتف خاصو يكون 06/07 وبـ10 أرقام","err");toast(msg,"… كنصيفط OTP","info");confirmation=await firebase.signInWithPhoneNumber(auth,"+212"+phone.substring(1),verifier);toast(msg,"✅ تصيفط الكود فـ SMS","ok");}catch(e){console.error(e);toast(msg,"❌ مشكل فـ OTP. شوف Firebase settings.","err");}};verifyBtn.onclick=async()=>{try{if(!confirmation) return toast(msg,"⚠️ صيفط OTP الأول","err");const code=codeEl.value.trim();if(code.length<6) return toast(msg,"⚠️ كتب 6 أرقام","err");await confirmation.confirm(code);toast(msg,"✅ دخلتي بنجاح","ok");}catch(e){console.error(e);toast(msg,"❌ كود غلط/منتهي","err");}};</script></body></html>
