<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Rating</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"/></head><body class="bg-slate-50 text-slate-900"><div class="max-w-xl mx-auto p-5 md:p-8"><a class="inline-flex items-center gap-3" href="./index.html"><img src="./assets/logo.svg" class="h-10 w-auto" alt="AnaM3ak"/></a><div class="mt-6 bg-white rounded-[2.4rem] border border-slate-100 shadow-xl p-7 md:p-10"><h1 class="text-3xl font-black">قيّم الخدمة ⭐</h1><p class="mt-2 text-sm font-bold text-slate-500">غير من بعد DONE و Token صحيح.</p><div id="order" class="mt-4 text-sm font-black text-slate-700"></div><div class="mt-5 flex gap-2 flex-wrap"><button class="star px-5 py-3 rounded-2xl font-black border border-slate-200" data-v="1">1</button><button class="star px-5 py-3 rounded-2xl font-black border border-slate-200" data-v="2">2</button><button class="star px-5 py-3 rounded-2xl font-black border border-slate-200" data-v="3">3</button><button class="star px-5 py-3 rounded-2xl font-black border border-slate-200" data-v="4">4</button><button class="star px-5 py-3 rounded-2xl font-black border border-slate-200" data-v="5">5</button></div><textarea id="comment" placeholder="تعليق (اختياري)" class="mt-4 w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300 min-h-[120px]"></textarea><button id="submit" class="mt-6 w-full btn-primary text-white py-5 rounded-[2rem] font-black text-lg">صيفط التقييم ✅</button><div id="msg" class="mt-4 text-sm font-black text-slate-700"></div></div></div><script type="module">import { db, firebase } from "./firebase.js";import { sanitizeText, toast } from "./utils.js";const params=new URLSearchParams(location.search);const rid=params.get("rid");const token=params.get("t");const msg=document.getElementById("msg");document.getElementById("order").textContent=rid?("Order: "+rid):"⚠️ رابط ناقص";let stars=0;document.querySelectorAll(".star").forEach(b=>{b.onclick=()=>{stars=Number(b.dataset.v);document.querySelectorAll(".star").forEach(x=>x.classList.remove("bg-blue-600","text-white","border-blue-600"));b.classList.add("bg-blue-600","text-white","border-blue-600");};});document.getElementById("submit").onclick=async()=>{try{if(!rid||!token) return toast(msg,"⚠️ رابط ناقص","err");if(stars<1) return toast(msg,"⚠️ اختار النجوم","err");const rRef=firebase.doc(db,"requests",rid);const rSnap=await firebase.getDoc(rRef);if(!rSnap.exists()) return toast(msg,"⚠️ الطلب ماكاينش","err");const r=rSnap.data();if(r.status!=="done") return toast(msg,"⚠️ مازال ما تكملاتش الخدمة","err");if(r.ratingToken!==token) return toast(msg,"⚠️ Token غلط","err");if(r.ratedAt) return toast(msg,"⚠️ تقيّمتي من قبل","err");const comment=sanitizeText(document.getElementById("comment").value);await firebase.updateDoc(rRef,{rating:stars,ratingComment:comment,ratedAt:firebase.serverTimestamp(),updatedAt:firebase.serverTimestamp()});const proId=r.acceptedBy;if(proId){const pRef=firebase.doc(db,"pros",proId);const pSnap=await firebase.getDoc(pRef);if(pSnap.exists()){const p=pSnap.data();const c=(p.ratingCount||0)+1;const avg=((p.ratingAvg||0)*(c-1)+stars)/c;await firebase.updateDoc(pRef,{ratingCount:c,ratingAvg:avg,updatedAt:firebase.serverTimestamp()});}}toast(msg,"✅ شكرا! تقيّمتي بنجاح.","ok");}catch(e){console.error(e);toast(msg,"❌ وقع مشكل","err");}};</script></body></html>
