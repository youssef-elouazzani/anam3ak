<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>تسجيل حرفي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"/></head><body class="bg-slate-50 text-slate-900"><div class="max-w-4xl mx-auto p-5 md:p-8"><div class="flex items-center justify-between gap-4"><a class="inline-flex items-center gap-3" href="./index.html"><img src="./assets/logo.svg" class="h-10 w-auto" alt="AnaM3ak"/></a><a href="./login.html" class="px-5 py-3 rounded-2xl font-black border border-slate-200 hover:bg-white">دخول OTP</a></div><div class="mt-6 bg-white rounded-[2.4rem] border border-slate-100 shadow-xl p-7 md:p-10"><h1 class="text-3xl font-black">تسجيل الحرفي</h1><p class="mt-2 text-sm font-bold text-slate-500">خاصك تكون داخل بـ OTP. غادي نرفع الصورة لـ Storage ونسجلو البروفايل فـ Firestore.</p><div class="mt-6 bg-slate-50 border border-slate-100 rounded-[2.2rem] p-6"><div class="font-black mb-3">صورة الحرفي</div><div class="flex items-center gap-4"><div class="w-20 h-20 rounded-2xl bg-white border border-slate-200 overflow-hidden flex items-center justify-center"><img id="photoPreview" class="w-full h-full object-cover hidden"/><span id="photoPlaceholder" class="text-slate-400 font-black text-xs">Preview</span></div><div class="flex-1"><input id="proPhoto" type="file" accept="image/png,image/jpeg,image/webp" class="block w-full text-sm font-bold text-slate-700 file:mr-4 file:py-3 file:px-4 file:rounded-2xl file:border-0 file:text-sm file:font-black file:bg-blue-600 file:text-white hover:file:bg-blue-700"/><div class="mt-2 text-xs font-extrabold text-slate-500">PNG/JPG/WEBP — Max 2MB</div></div></div><div id="photoMsg" class="mt-3 text-xs font-black text-red-600"></div></div><div class="mt-6 grid md:grid-cols-2 gap-4"><input id="name" placeholder="الاسم الكامل" class="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 font-black outline-none focus:border-blue-300"><input id="phone" placeholder="06xxxxxxxx" class="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 font-black outline-none focus:border-blue-300"><select id="service" class="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 font-black outline-none focus:border-blue-300"><option value="">اختار الحرفة...</option><option>بلومبي</option><option>كهربائي</option><option>كليماتيزور</option><option>كاميرات</option><option>نجار</option><option>صبّاغ</option><option>أخرى</option></select><select id="city" class="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 font-black outline-none focus:border-blue-300"></select></div><textarea id="about" placeholder="وصف صغير" class="mt-4 w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 font-black outline-none focus:border-blue-300 min-h-[120px]"></textarea><div class="mt-6 flex items-start gap-3"><input id="agree" type="checkbox" class="mt-1 w-5 h-5"><label for="agree" class="text-sm font-bold text-slate-700 leading-relaxed">كنوافق على الشروط وسياسة الخصوصية</label></div><button id="submit" class="mt-6 w-full btn-primary text-white py-5 rounded-[2rem] font-black text-lg">تأكيد التسجيل ✅</button><div id="msg" class="mt-4 text-sm font-black text-slate-700"></div><div class="pt-2 text-sm font-bold text-slate-600">Dashboard: <a class="text-blue-600 underline" href="./pro-dashboard.html">هنا</a></div></div></div><script type="module">import { auth, db, storage, firebase } from "./firebase.js";import { fillCities, isValidMoroccoPhone, sanitizeText, toast } from "./utils.js";fillCities(document.getElementById("city"));const proPhoto=document.getElementById("proPhoto");const photoPreview=document.getElementById("photoPreview");const photoPlaceholder=document.getElementById("photoPlaceholder");const photoMsg=document.getElementById("photoMsg");function validateFile(file){const ok=["image/jpeg","image/png","image/webp"];const max=2*1024*1024;if(!file) return "⚠️ خاصك تحط صورة";if(!ok.includes(file.type)) return "⚠️ خاص الصورة تكون JPG/PNG/WEBP";if(file.size>max) return "⚠️ الصورة كبيرة (Max 2MB)";return "";}proPhoto.addEventListener("change",()=>{photoMsg.textContent="";const f=proPhoto.files&&proPhoto.files[0];const err=validateFile(f);if(err){photoMsg.textContent=err;proPhoto.value="";return;}const url=URL.createObjectURL(f);photoPreview.src=url;photoPreview.classList.remove("hidden");photoPlaceholder.classList.add("hidden");});const msg=document.getElementById("msg");document.getElementById("submit").onclick=async()=>{try{toast(msg,"… كنوجد التسجيل","info");const user=auth.currentUser;if(!user) return toast(msg,"⚠️ خاصك Login OTP الأول","err");const name=sanitizeText(document.getElementById("name").value);const phone=sanitizeText(document.getElementById("phone").value);const service=sanitizeText(document.getElementById("service").value);const city=sanitizeText(document.getElementById("city").value);const about=sanitizeText(document.getElementById("about").value);const agree=document.getElementById("agree").checked;if(!name||!phone||!service||!city) return toast(msg,"⚠️ عمّر المعلومات","err");if(!isValidMoroccoPhone(phone)) return toast(msg,"⚠️ رقم الهاتف غير صحيح","err");if(!agree) return toast(msg,"⚠️ خاصك توافق على الشروط","err");const file=proPhoto.files&&proPhoto.files[0];const err=validateFile(file);if(err) return toast(msg,err,"err");const path=`pros/${user.uid}/profile.${file.type.includes("png")?"png":file.type.includes("webp")?"webp":"jpg"}`;const r=firebase.sRef(storage,path);await firebase.uploadBytes(r,file,{contentType:file.type});const photoURL=await firebase.getDownloadURL(r);await firebase.setDoc(firebase.doc(db,"pros",user.uid),{uid:user.uid,name,phone,service,city,about,photoURL,status:"pending",ratingAvg:0,ratingCount:0,createdAt:firebase.serverTimestamp(),updatedAt:firebase.serverTimestamp()},{merge:true});toast(msg,"✅ تسجّلتي! status=pending حتى يتوافق Admin.","ok");}catch(e){console.error(e);toast(msg,"❌ وقع مشكل: شوف Console","err");}};</script></body></html>
