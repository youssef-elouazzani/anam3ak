<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Dashboard</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"/></head><body class="bg-slate-50 text-slate-900"><div class="max-w-6xl mx-auto p-5 md:p-8"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><a class="inline-flex items-center gap-3" href="./index.html"><img src="./assets/logo.svg" class="h-10 w-auto" alt="AnaM3ak"/></a><div class="flex items-center gap-2"><a href="./pro-register.html" class="px-5 py-3 rounded-2xl font-black border border-slate-200 hover:bg-white">بروفايل</a><button id="logout" class="btn-soft px-5 py-3 rounded-2xl font-black">Logout</button></div></div><div class="mt-6 bg-white rounded-[2.4rem] border border-slate-100 shadow-xl p-7 md:p-10"><div class="flex flex-col md:flex-row md:items-end justify-between gap-4"><div><h1 class="text-3xl font-black">Dashboard للحرفي</h1><p class="mt-2 text-sm font-bold text-slate-500">طلبات نفس المدينة+الحرفة. Accept و Done.</p></div><div class="text-right"><div id="proInfo" class="text-sm font-black text-slate-700"></div><div id="proStatus" class="text-xs font-extrabold text-slate-500 mt-1"></div></div></div><div class="mt-8"><h2 class="text-xl font-black">الطلبات</h2><div id="list" class="mt-4 grid gap-4"></div><div id="msg" class="mt-4 text-sm font-black text-slate-700"></div></div></div></div><script type="module">import { auth, db, firebase } from "./firebase.js";import { toast } from "./utils.js";const msg=document.getElementById("msg");const list=document.getElementById("list");const proInfo=document.getElementById("proInfo");const proStatus=document.getElementById("proStatus");document.getElementById("logout").onclick=async()=>{await firebase.signOut(auth);location.href="./login.html";};firebase.onAuthStateChanged(auth,async(user)=>{if(!user){location.href="./login.html";return;}const pRef=firebase.doc(db,"pros",user.uid);const pSnap=await firebase.getDoc(pRef);if(!pSnap.exists()){toast(msg,"⚠️ ماكاينش بروفايل. دوز لـ /pro-register.html","err");return;}const pro=pSnap.data();proInfo.textContent=`${pro.name} • ${pro.service} • ${pro.city}`;proStatus.textContent=`Status: ${pro.status} • Rating: ${(pro.ratingAvg||0).toFixed(1)} (${pro.ratingCount||0})`;const q1=firebase.query(firebase.collection(db,"requests"),firebase.where("city","==",pro.city),firebase.where("service","==",pro.service),firebase.orderBy("createdAt","desc"),firebase.limit(50));firebase.onSnapshot(q1,(snap)=>{list.innerHTML="";snap.forEach(docu=>{const r=docu.data();const id=docu.id;const canAccept=r.status==="open";const canDone=r.status==="accepted"&&r.acceptedBy===user.uid;const el=document.createElement("div");el.className="bg-white border border-slate-100 rounded-[1.8rem] p-6";el.innerHTML=`<div class="flex flex-col md:flex-row md:items-start justify-between gap-3"><div><div class="font-black text-lg">${r.service} • ${r.city}</div><div class="text-sm font-bold text-slate-500 mt-1">${r.address}</div><div class="text-sm font-bold text-slate-700 mt-3 leading-relaxed">${r.details}</div><div class="text-xs font-extrabold text-slate-500 mt-3">Status: <b>${r.status}</b> • ${id}</div></div><div class="flex gap-2 flex-wrap"><button class="accept px-5 py-3 rounded-2xl font-black ${canAccept?'btn-primary text-white':'bg-slate-100 text-slate-400'}" ${canAccept?'':'disabled'}>Accept</button><button class="done px-5 py-3 rounded-2xl font-black ${canDone?'bg-emerald-600 text-white hover:bg-emerald-700':'bg-slate-100 text-slate-400'}" ${canDone?'':'disabled'}>Done</button></div></div>`;el.querySelector(".accept").onclick=async()=>{try{await firebase.updateDoc(firebase.doc(db,"requests",id),{status:"accepted",acceptedBy:user.uid,acceptedAt:firebase.serverTimestamp(),updatedAt:firebase.serverTimestamp()});}catch(e){console.error(e);toast(msg,"❌ ماقدرناش نقبلو الطلب. شوف Rules.","err");}};el.querySelector(".done").onclick=async()=>{try{const token=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);await firebase.updateDoc(firebase.doc(db,"requests",id),{status:"done",doneAt:firebase.serverTimestamp(),ratingToken:token,updatedAt:firebase.serverTimestamp()});toast(msg,"✅ DONE. رابط التقييم: rate.html?rid="+id+"&t="+token,"ok");}catch(e){console.error(e);toast(msg,"❌ ماقدرناش نديرو DONE.","err");}};list.appendChild(el);});});});</script></body></html>
