<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>طلب خدمة</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"/></head><body class="bg-slate-50 text-slate-900"><div class="max-w-4xl mx-auto p-5 md:p-8"><div class="flex items-center justify-between gap-4"><a class="inline-flex items-center gap-3" href="./index.html"><img src="./assets/logo.svg" class="h-10 w-auto" alt="AnaM3ak"/></a><a href="./login.html" class="px-5 py-3 rounded-2xl font-black border border-slate-200 hover:bg-white">دخول OTP</a></div><div class="mt-6 bg-white rounded-[2.4rem] border border-slate-100 shadow-xl p-7 md:p-10"><h1 class="text-3xl font-black">طلب خدمة</h1><p class="mt-2 text-sm font-bold text-slate-500">الطلب كيتسجل فـ Firestore وكيبان للحرفيين القريبين (حسب المدينة+الحرفة).</p><div class="mt-6 grid md:grid-cols-2 gap-4"><input id="cName" placeholder="سميتك" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"><input id="cPhone" placeholder="رقم الهاتف (06/07)" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"><select id="cService" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"><option value="">اختار الخدمة...</option><option>بلومبي</option><option>كهربائي</option><option>كليماتيزور</option><option>كاميرات</option><option>نجار</option><option>صبّاغ</option><option>أخرى</option></select><select id="cCity" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"></select></div><input id="cAddress" placeholder="العنوان (الحي/الزنقة)" class="mt-4 w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300"><textarea id="cDetails" placeholder="شرح بسيط: شنو المشكل؟" class="mt-4 w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 font-black outline-none focus:border-blue-300 min-h-[140px]"></textarea><button id="submit" class="mt-6 w-full btn-primary text-white py-5 rounded-[2rem] font-black text-lg">صيفط الطلب ✅</button><div id="msg" class="mt-4 text-sm font-black text-slate-700"></div></div></div><script type="module">import { db, firebase } from "./firebase.js";import { fillCities, isValidMoroccoPhone, sanitizeText, toast } from "./utils.js";const cityEl=document.getElementById("cCity");fillCities(cityEl);const msg=document.getElementById("msg");document.getElementById("submit").onclick=async()=>{try{toast(msg,"… كنصيفط الطلب","info");const cName=sanitizeText(document.getElementById("cName").value);const cPhone=sanitizeText(document.getElementById("cPhone").value);const cService=sanitizeText(document.getElementById("cService").value);const cCity=sanitizeText(cityEl.value);const cAddress=sanitizeText(document.getElementById("cAddress").value);const cDetails=sanitizeText(document.getElementById("cDetails").value);if(!cName||!cPhone||!cService||!cCity||!cAddress||!cDetails) return toast(msg,"⚠️ عمّر المعلومات كاملين","err");if(!isValidMoroccoPhone(cPhone)) return toast(msg,"⚠️ رقم الهاتف غير صحيح","err");const ref=await firebase.addDoc(firebase.collection(db,"requests"),{customerName:cName,customerPhone:cPhone,service:cService,city:cCity,address:cAddress,details:cDetails,status:"open",acceptedBy:null,acceptedAt:null,doneAt:null,ratingToken:null,createdAt:firebase.serverTimestamp(),updatedAt:firebase.serverTimestamp()});toast(msg,"✅ تصيفط الطلب! OrderID: "+ref.id,"ok");}catch(e){console.error(e);toast(msg,"❌ وقع مشكل فـ إرسال الطلب","err");}};</script></body></html>
